[project]
name = "pensig"
version = "0.1.0"
description = "MuJoCo replica of a UR7e cell and RL (PPO) for stacking a three-block tower, with a ROS 2 package for the real arm"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "numpy",
    "scipy",
    "gymnasium>=1.0",
    "stable-baselines3>=2.3",
    "torch",
    "imageio",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest", "tensorboard"]

[tool.setuptools]
packages = ["pensig"]
