# Parameters for both nodes. Lengths in m, angles in rad, forces in N.
# Measure before the first run: gripper_length, the block heights, and the black top offset.

tower_perception:
  ros__parameters:
    cloud_topic: /camera/camera/depth/color/points
    max_rate: 5.0
    stride: 2
    max_y: 0.79              # keeps the wall out
    table_auto: true         # table z = most populated height in [table_min_z, table_max_z]
    table_min_z: -0.40
    table_max_z: 0.10
    table_annulus_min: 0.06  # local table height: points this far from the block center ...
    table_annulus_max: 0.15  # ... up to this
    band_min: 0.008          # block points: this far above the table ...
    band_max: 0.20           # ... up to this
    # HSV in OpenCV units (H 0..179)
    green_h_min: 40
    green_h_max: 85
    green_s_min: 80
    green_v_min: 40
    red_h_max: 10
    red_h_min: 170
    red_s_min: 120
    red_v_min: 50
    black_v_max: 80          # black = low V
    # The RealSense reads dark tops low: measured on the lab blocks, green 42 for 50 mm, black 65 for 80,
    # red 31 for 30. Ruler height minus /tower/<color>/height (positive raises the top).
    black_top_offset: 0.015
    green_top_offset: 0.008
    red_top_offset: -0.001
    finger_radius: 0.04
    gripper_length: 0.16

tower:
  ros__parameters:
    step: true               # Enter before every motion and gripper toggle
    dry_run: false
    stages: 2                # 1: black on green only
    velocity_scaling: 0.1    # MoveIt-planned moves
    acceleration_scaling: 0.1
    gripper_length: 0.16     # flange to fingertips as measured on the lab Hand-E
    finger_above_bottom: 0.015
    table_clearance: 0.02
    clearance: 0.05
    pre_grasp: 0.05
    second_estimate: true
    closeup_height: 0.30     # camera above the block top for the close-up
    camera_offset: [-0.025, 0.13, 0.0]  # must match the static TF in the launch file
    finger_axis_yaw: 0.0     # set to 0.785 if the fingers close diagonally at yaw 0
    move_speed: 0.03
    approach_speed: 0.02
    slow_zone: 0.012
    slow_speed: 0.01
    search_below: 0.004
    contact_force: 3.0
    approach_force: 6.0
    guard_force: 15.0
    retract: 0.08
    green_height: 0.05
    black_height: 0.08
    red_height: 0.03

tower_policy:
  ros__parameters:
    repo: ""                 # pensig checkout; empty: ~/ur7e-block-tower, else ~/ur-pen-signature
    policy: runs/tower_v6/policy.npz  # from scripts/export_tower_policy.py; final_model.zip needs torch + SB3
    step: true               # Enter before each planned move and before each stage's loop
    dry_run: false           # IK and log only, the fingertips "follow" the command exactly
    stages: 2
    time_scale: 3.0          # loop period = 0.05 s * time_scale: the sim's motion at a third of its speed
    max_speed: 0.20          # m/s, backstop: the sim commands up to 0.52 m/s, so 0.17 at time_scale 3
    max_yaw_rate: 1.0        # rad/s, backstop (sim: 0.15 rad per step)
    lookahead: 1.0           # periods until each streamed point is reached
    step_limit: 160          # sim episode_steps; stages took ~85 in sim
    guard_force: 15.0
    force_sign: -1.0         # pushing the fingers up must log a positive policy force z
    tracking_tol: 0.04
    arrive_tol: 0.003        # wait each period until the fingertips are this close to the command
    arrive_timeout: 3.0
    gripper_threshold: 0.5
    gripper_wait: 1.0
    grasp_raise: 0.01        # grasp 25 mm above the block bottom instead of the sim's 15 (black top hit the palm)
    closeup: true
    closeup_height: 0.30
    camera_offset: [-0.025, 0.13, 0.0]
    gripper_length: 0.16
    finger_axis_yaw: 0.0
    auto_offset: true        # shift xy so the blocks sit where they were in training (x 0.38..0.60, |y| < 0.18)
    world_offset: [0.0, 0.0] # used when auto_offset is false: policy xy = base_link xy + this
    world_yaw: 0.0
    table_z_expected: -0.206
    green_size: [0.05, 0.05] # (width, height), ruler
    black_size: [0.04, 0.08]
    red_size: [0.035, 0.03]
    velocity_scaling: 0.1
    acceleration_scaling: 0.1
